spring.application.name=seller-onboarding
server.port=${PORT:8080}

# Load backend/.env if it exists (keys like JWT_SECRET become available to ${...} below)
spring.config.import=optional:file:.env[.properties]

# ── Database ── default: local H2 file database (no install needed)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/selleronboarding}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# update = create/alter tables automatically. Use "validate" in production with migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# ── Authentication (JWT) ── no default on purpose: the app refuses to start without a secret
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ── CORS ──
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Gemini ── key stays on the server
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# ── Document storage ──
app.storage.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
